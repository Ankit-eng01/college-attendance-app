<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Attendify</title>
  <!-- Glyph paths from Lucide (ISC License): graduation-cap and check. https://lucide.dev -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1e23" />
      <stop offset="55%" stop-color="#0d0f12" />
      <stop offset="100%" stop-color="#050607" />
    </linearGradient>
    <linearGradient id="champagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4e5ca" />
      <stop offset="50%" stop-color="#d9bc8c" />
      <stop offset="100%" stop-color="#ad8850" />
    </linearGradient>
  </defs>

  <!-- Full-bleed tile with an inset hairline frame -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="4" />

  <!-- 75% attendance progress arc -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#24272d" stroke-width="15" stroke-linecap="round" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#champagne)" stroke-width="15" stroke-linecap="round"
          stroke-dasharray="943 943" stroke-dashoffset="236" transform="rotate(-90 256 256)" />

  <!-- Lucide graduation-cap glyph -->
  <g transform="translate(169.6 133.6) scale(7.2)" fill="none" stroke="url(#champagne)" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
    <path d="M22 10v6" />
    <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
  </g>

  <!-- Lucide check glyph badge -->
  <circle cx="364" cy="364" r="34" fill="url(#champagne)" stroke="#0b0c0e" stroke-width="6" />
  <g transform="translate(338.4 338.4) scale(2.4)" fill="none" stroke="#161006" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6 9 17l-5-5" />
  </g>
</svg>
