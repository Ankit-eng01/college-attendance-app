<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Circular progress ring meter -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="32" stroke-linecap="round" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="32" stroke-linecap="round"
          stroke-dasharray="1068" stroke-dashoffset="267" filter="url(#glow)" transform="rotate(-90 256 256)" />

  <!-- Graduation Cap & Checklist Motif -->
  <g transform="translate(256 240)">
    <!-- Cap Diamond -->
    <path d="M 0 -70 L 95 -25 L 0 20 L -95 -25 Z" fill="url(#accentGrad)" />
    <!-- Cap Skull Base -->
    <path d="M -55 -4 L -55 35 Q 0 65 55 35 L 55 -4 Q 0 20 -55 -4 Z" fill="#4338ca" />
    <!-- Tassel String and Bead -->
    <path d="M 0 -25 Q 60 -10 75 15 L 75 45" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <circle cx="75" cy="50" r="6" fill="#fbbf24" />
  </g>

  <!-- Checkmark Emblem in center bottom -->
  <circle cx="256" cy="340" r="38" fill="#10b981" filter="url(#glow)" />
  <path d="M 242 340 L 252 350 L 270 332" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
